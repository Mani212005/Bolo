<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolo</title>
<style>
  :root {
    --bg: #07090f;
    --card: rgba(255,255,255,.055);
    --card-border: rgba(255,255,255,.12);
    --text: #eef1f7;
    --muted: #98a0b3;
    --accent: #8b7cf6;
    --accent2: #22d3ee;
    --ok: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Inter", "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* ---- glass background blobs ---- */
  .blobs { position: fixed; inset: 0; z-index: -1; overflow: clip; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .28; }
  /* every blob rect stays inside the viewport; the blur provides edge bleed */
  .blob.a { width: 34vw; height: 34vw; left: 2vw; top: 2vh;
    background: radial-gradient(circle at 30% 30%, #7c5cff, transparent 65%); }
  .blob.b { width: 38vw; height: 38vw; right: 2vw; top: 14vh;
    background: radial-gradient(circle at 60% 40%, #0ea5e9, transparent 65%); }
  .blob.c { width: 30vw; height: 30vw; left: 33vw; bottom: 2vh;
    background: radial-gradient(circle at 50% 50%, #d946ef, transparent 65%); }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 22px 120px; }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .logo {
    width: 40px; height: 40px; border-radius: 13px; flex: none;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
    display: grid; place-items: center; font-weight: 800; font-size: 19px; color: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .spacer { flex: 1; }
  .pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 10px var(--ok); }
  .dot.rec { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
  .dot.off { background: #5b6272; box-shadow: none; }
  .dot.busy { background: var(--warn); box-shadow: 0 0 10px var(--warn); }

  /* ---- cards ---- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 16px; }
  .card {
    grid-column: span 12;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%);
    box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
    padding: 20px 22px;
    min-width: 0;
  }
  @media (min-width: 880px) {
    .c6 { grid-column: span 6; }
    .c7 { grid-column: span 7; }
    .c5 { grid-column: span 5; }
  }
  .card h2 { font-size: 13px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px; min-height: 28px; }
  .card h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 500;
    margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
  .hint { color: #6b7284; font-size: 12px; }

  /* segmented control */
  .seg { display: flex; gap: 6px; background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 5px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 9px 6px; border-radius: 10px; font: inherit; font-size: 13.5px; cursor: pointer;
    transition: all .18s ease; min-width: 0;
  }
  .seg button.on {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-weight: 650;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 4px 14px rgba(0,0,0,.25);
  }
  .seg button small { display: block; font-size: 10.5px; opacity: .75; font-weight: 500; }

  /* rows / selects */
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .row + .row { border-top: 1px solid rgba(255,255,255,.06); }
  .row .grow { flex: 1; min-width: 0; }
  .row label.title { font-size: 14.5px; }
  select, input[type="text"], textarea {
    background: rgba(0,0,0,.28); color: var(--text);
    border: 1px solid rgba(255,255,255,.1); border-radius: 11px;
    padding: 9px 12px; font: inherit; font-size: 13.5px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: rgba(255,255,255,.35); }
  textarea { width: 100%; resize: vertical; line-height: 1.5; }

  /* toggle */
  .toggle { position: relative; width: 46px; height: 26px; flex: none; cursor: pointer; }
  .toggle input { display: none; }
  .toggle span {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.1);
    transition: all .18s ease;
  }
  .toggle span::after {
    content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
    top: 2px; left: 2px; background: #cdd3e0; transition: all .18s ease;
  }
  .toggle input:checked + span {
    background: #dfe4ee; border-color: transparent;
  }
  .toggle input:checked + span::after { left: 23px; background: #12141c; }

  /* keycaps */
  .keys { display: inline-flex; gap: 5px; }
  .key {
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14);
    border-bottom-width: 2.5px; border-radius: 8px; padding: 4px 10px;
    font-size: 12.5px; font-weight: 600; color: #dfe4ef;
  }
  .btn {
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07);
    color: var(--text); border-radius: 11px; padding: 8px 14px; font: inherit;
    font-size: 13px; cursor: pointer; transition: all .15s ease; flex: none;
  }
  .btn:hover { background: rgba(255,255,255,.13); }
  .btn.primary {
    background: #e8ebf2; color: #0b0e17; font-weight: 650; border-color: transparent;
    box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  .btn.small { padding: 5px 10px; font-size: 12px; border-radius: 9px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: rgba(255,255,255,.07); }
  .btn.recording { border-color: var(--danger); color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2);
    padding: 5px 7px 5px 12px; border-radius: 999px; font-size: 13px;
  }
  .chip button { border: 0; background: rgba(255,255,255,.12); color: var(--text);
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer; font-size: 11px;
    line-height: 1; display: grid; place-items: center; }
  .chip button:hover { background: var(--danger); }
  .chips input { border-radius: 999px; padding: 6px 14px; width: 130px; }

  /* history */
  .feed { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
  .entry {
    background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.07);
    border-radius: 13px; padding: 10px 13px;
  }
  .entry .meta { display: flex; align-items: center; gap: 8px; color: #6b7284;
    font-size: 11.5px; margin-bottom: 4px; }
  .entry .meta .spacer { flex: 1; }
  .entry p { font-size: 13.5px; color: #ccd2df; word-wrap: break-word; }
  .entry .tag { font-size: 10px; padding: 1px 8px; border-radius: 99px;
    border: 1px solid rgba(255,255,255,.25); color: #c3c9d6; }

  /* save bar */
  .savebar {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(90px);
    display: flex; align-items: center; gap: 14px;
    background: rgba(20,23,34,.75); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 999px; padding: 10px 12px 10px 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    transition: transform .25s ease; z-index: 10;
  }
  .savebar.show { transform: translateX(-50%) translateY(0); }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(90px);
    background: rgba(20,23,34,.85); border: 1px solid rgba(52,211,153,.4);
    backdrop-filter: blur(20px); border-radius: 999px; padding: 11px 22px; font-size: 13.5px;
    transition: transform .25s ease; z-index: 11;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .mic-result { margin-top: 10px; font-size: 13.5px; color: #c8cede; min-height: 20px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }
</style>
</head>
<body>
<div class="blobs"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

<div class="wrap">
  <header>
    <div class="logo">B</div>
    <div>
      <h1>Bolo</h1>
      <div class="sub">speak anywhere · your words, your machine</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="micTestBtn" onclick="micTest()">🎙 Test mic</button>
    <div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
  </header>

  <div class="grid">

    <!-- Speech engine -->
    <section class="card c7">
      <h2>Speech engine</h2>
      <div class="seg" id="providerSeg">
        <button data-v="groq">Groq cloud<small>~0.5s · needs key</small></button>
        <button data-v="faster-whisper">Faster-Whisper<small>local · private · fast</small></button>
        <button data-v="whisper">Whisper.cpp<small>local · no Python</small></button>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="title grow">Local model</label>
        <select id="model">
          <option value="base.en">base.en — fastest (0.7s / 11s audio)</option>
          <option value="distil-small.en">distil-small.en — balanced (1.5s)</option>
          <option value="small.en">small.en — most accurate (1.9s)</option>
        </select>
      </div>
      <div class="mic-result" id="micResult"></div>
    </section>

    <!-- Hotkeys -->
    <section class="card c5">
      <h2>Hotkeys <span class="hint">click Change, then press your combo</span></h2>
      <div class="row">
        <label class="title grow">Start / finish dictation</label>
        <span class="keys" id="keys-toggle"></span>
        <button class="btn small" onclick="captureKey('toggle', this)">Change</button>
      </div>
      <div class="row">
        <label class="title grow">Pause / resume</label>
        <span class="keys" id="keys-pause"></span>
        <button class="btn small" onclick="captureKey('pause', this)">Change</button>
      </div>
      <div class="row">
        <label class="title grow">Insert / re-type</label>
        <span class="keys" id="keys-insert"></span>
        <button class="btn small" onclick="captureKey('insert', this)">Change</button>
      </div>
    </section>

    <!-- Behavior -->
    <section class="card c5">
      <h2>Behavior</h2>
      <div class="row">
        <label class="title grow">Start / stop sounds</label>
        <label class="toggle"><input type="checkbox" id="sounds" onchange="dirtyConfig()"><span></span></label>
      </div>
      <div class="row">
        <label class="title grow">Notifications</label>
        <label class="toggle"><input type="checkbox" id="notifications" onchange="dirtyConfig()"><span></span></label>
      </div>
      <div class="row">
        <label class="title grow">Auto-stop after 1.5s silence</label>
        <label class="toggle"><input type="checkbox" id="auto_endpoint" onchange="dirtyConfig()"><span></span></label>
      </div>
      <div class="row">
        <label class="title grow">Insert text by</label>
        <select id="method" onchange="dirtyConfig()">
          <option value="paste">Instant paste (Ctrl+V)</option>
          <option value="portal">Typing (char by char)</option>
          <option value="clipboard">Clipboard only</option>
        </select>
      </div>
      <div class="row">
        <label class="title grow">Max recording length</label>
        <select id="max_len" onchange="dirtyConfig()">
          <option value="60000">1 min</option>
          <option value="120000">2 min</option>
          <option value="300000">5 min</option>
          <option value="600000">10 min</option>
        </select>
      </div>
    </section>

    <!-- Vocabulary -->
    <section class="card c7">
      <h2>Vocabulary <span class="hint">words Bolo must spell right — applies instantly</span></h2>
      <div class="chips" id="chips"></div>
    </section>

    <!-- Enhance prompt -->
    <section class="card c6">
      <h2>Enhance prompt <span class="hint" id="epState">applies instantly</span></h2>
      <textarea id="enhancePrompt" rows="6"
        placeholder="Describe how the ✨ Enhance button should rewrite your dictations. Empty = built-in default."></textarea>
    </section>

    <!-- Scratchpad -->
    <section class="card c6">
      <h2>Scratchpad
        <span class="hint">
          <button class="btn small ghost" onclick="copyPad()">Copy</button>
          <button class="btn small ghost" id="padState" onclick="savePad()">Save</button>
        </span>
      </h2>
      <textarea id="pad" rows="9" placeholder="A quiet place for your words — append dictations from the history, edit, save."></textarea>
    </section>

    <!-- History -->
    <section class="card">
      <h2>Dictation history
        <span class="hint"><button class="btn small ghost" onclick="clearHistory()">Clear</button></span>
      </h2>
      <div class="feed" id="feed"></div>
    </section>

  </div>
</div>

<div class="savebar" id="savebar">
  <span style="font-size:13.5px">Unsaved engine/behavior changes</span>
  <button class="btn primary" onclick="saveConfig()">Save &amp; restart Bolo</button>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// Same file serves as the lavish design artifact and the real app: when the
// daemon API is absent, it falls back to demo state so the design reviews
// standalone.
const DEMO = {
  status: "idle",
  provider: "faster-whisper",
  model: "small.en",
  sounds: true, notifications: true, auto_endpoint: false,
  method: "paste", max_len: 300000,
  hotkeys: { toggle: "<Control>space", pause: "<Alt>p", insert: "<Alt>i" },
  vocab: ["Groq", "Claude", "Bolo"],
  enhance_prompt: "",
  scratchpad: "",
  history: [
    { ts: Date.now()/1000 - 60, kind: "dictation", text: "This is the notion document, go through this and let me know what you think." },
    { ts: Date.now()/1000 - 1500, kind: "enhanced", text: "Review the linked Notion document and share your assessment." },
    { ts: Date.now()/1000 - 4000, kind: "dictation", text: "Add a pause button and a way to paste a link mid-dictation." },
  ],
};
let state = null, live = false, dirty = false, padTimer = null;

const $ = (id) => document.getElementById(id);
const api = async (path, opts) => {
  const r = await fetch("/api/" + path, opts);
  if (!r.ok) throw new Error(await r.text());
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
};

function toast(msg, ms = 2600) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), ms);
}

// ---------- render ----------
function keycaps(binding) {
  // "<Control>space" -> ["Ctrl", "Space"]
  const pretty = { Control: "Ctrl", Primary: "Ctrl", Alt: "Alt", Shift: "Shift", Super: "Super" };
  const parts = [];
  let rest = binding || "";
  for (const m of rest.matchAll(/<([A-Za-z]+)>/g)) parts.push(pretty[m[1]] || m[1]);
  rest = rest.replace(/<[A-Za-z]+>/g, "");
  if (rest) parts.push(rest.length === 1 ? rest.toUpperCase() : rest[0].toUpperCase() + rest.slice(1));
  return parts.map((p) => `<span class="key">${p}</span>`).join("");
}

function render() {
  const s = state;
  document.querySelectorAll("#providerSeg button").forEach((b) => {
    b.classList.toggle("on", b.dataset.v === s.provider);
  });
  $("model").value = s.model;
  $("sounds").checked = s.sounds;
  $("notifications").checked = s.notifications;
  $("auto_endpoint").checked = s.auto_endpoint;
  $("method").value = s.method;
  $("max_len").value = String(s.max_len);
  for (const k of ["toggle", "pause", "insert"]) $("keys-" + k).innerHTML = keycaps(s.hotkeys[k]);
  renderChips();
  if (document.activeElement !== $("enhancePrompt")) $("enhancePrompt").value = s.enhance_prompt;
  if (document.activeElement !== $("pad")) $("pad").value = s.scratchpad;
  renderFeed();
}

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  state.vocab.forEach((term, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `${term} <button title="remove">✕</button>`;
    chip.querySelector("button").onclick = () => { state.vocab.splice(i, 1); saveVocab(); };
    box.appendChild(chip);
  });
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "add word…";
  input.onkeydown = (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      state.vocab.push(input.value.trim());
      saveVocab();
    }
  };
  box.appendChild(input);
}

function renderFeed() {
  const feed = $("feed");
  feed.innerHTML = "";
  if (!state.history.length) {
    feed.innerHTML = '<span class="hint">Your dictations will appear here.</span>';
    return;
  }
  for (const e of [...state.history].reverse()) {
    const d = new Date(e.ts * 1000);
    const el = document.createElement("div");
    el.className = "entry";
    el.innerHTML = `
      <div class="meta">
        <span>${d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
        ${e.kind === "enhanced" ? '<span class="tag">enhanced</span>' : ""}
        <span class="spacer"></span>
        <button class="btn small ghost" data-a="copy">Copy</button>
        <button class="btn small ghost" data-a="enhance">✨ Enhance</button>
        <button class="btn small ghost" data-a="pad">→ Pad</button>
      </div>
      <p></p>`;
    el.querySelector("p").textContent = e.text;
    el.querySelector('[data-a="copy"]').onclick = () => { navigator.clipboard.writeText(e.text); toast("Copied"); };
    el.querySelector('[data-a="pad"]').onclick = () => {
      $("pad").value = ($("pad").value.trim() + "\n\n" + e.text).trim();
      padChanged();
      toast("Appended to scratchpad");
    };
    el.querySelector('[data-a="enhance"]').onclick = async (ev) => {
      ev.target.textContent = "…";
      try {
        const out = live ? await api("enhance", { method: "POST", body: e.text }) : { text: "Enhanced: " + e.text };
        navigator.clipboard.writeText(out.text);
        toast("Enhanced & copied — Alt+I types it at your cursor, Cmd+V (Mac) or Ctrl+V pastes");
        refresh();
      } catch (err) { toast("Enhance failed: " + err.message, 4200); }
      ev.target.textContent = "✨ Enhance";
    };
    feed.appendChild(el);
  }
}

function setStatus(s) {
  const dot = $("statusDot");
  dot.className = "dot " + ({ idle: "", recording: "rec", paused: "busy", processing: "busy" }[s] ?? "off");
  $("statusText").textContent = s + (live ? "" : " (demo)");
}

// ---------- actions ----------
function dirtyConfig() {
  dirty = true;
  $("savebar").classList.add("show");
}

document.querySelectorAll("#providerSeg button").forEach((b) => {
  b.onclick = () => { state.provider = b.dataset.v; render(); dirtyConfig(); };
});
$("model").onchange = () => { state.model = $("model").value; dirtyConfig(); };

async function saveConfig() {
  const changes = {
    provider: state.provider,
    model: $("model").value,
    sounds: $("sounds").checked,
    notifications: $("notifications").checked,
    auto_endpoint: $("auto_endpoint").checked,
    method: $("method").value,
    max_utterance_ms: parseInt($("max_len").value, 10),
  };
  $("savebar").classList.remove("show");
  dirty = false;
  if (!live) return toast("Saved (demo)");
  try {
    await api("config", { method: "POST", body: JSON.stringify(changes) });
    toast("Saved — restarting Bolo…");
    await api("restart", { method: "POST" });
    setTimeout(refresh, 2500);
  } catch (e) { toast("Save failed: " + e.message, 4200); }
}

async function saveVocab() {
  renderChips();
  if (live) {
    try { await api("vocab", { method: "PUT", body: state.vocab.join("\n") }); } catch {}
  }
  toast("Vocabulary updated");
}

$("enhancePrompt").oninput = () => {
  $("epState").textContent = "saving…";
  clearTimeout(window._ep);
  window._ep = setTimeout(async () => {
    state.enhance_prompt = $("enhancePrompt").value;
    if (live) { try { await api("enhance-prompt", { method: "PUT", body: state.enhance_prompt }); } catch {} }
    $("epState").textContent = "saved ✓";
  }, 600);
};

function padChanged() {
  $("padState").textContent = "Save*";
  clearTimeout(padTimer);
  padTimer = setTimeout(savePad, 1500);
}
$("pad").oninput = padChanged;
async function savePad() {
  state.scratchpad = $("pad").value;
  if (live) { try { await api("scratchpad", { method: "PUT", body: state.scratchpad }); } catch {} }
  $("padState").textContent = "Saved ✓";
  setTimeout(() => ($("padState").textContent = "Save"), 1600);
}
function copyPad() { navigator.clipboard.writeText($("pad").value); toast("Scratchpad copied"); }

async function clearHistory() {
  state.history = [];
  renderFeed();
  if (live) { try { await api("history", { method: "DELETE" }); } catch {} }
}

// hotkey capture: press-to-record → GNOME binding syntax
function captureKey(action, btn) {
  btn.textContent = "press keys…";
  btn.classList.add("recording");
  const done = (binding) => {
    window.removeEventListener("keydown", handler, true);
    btn.textContent = "Change";
    btn.classList.remove("recording");
    if (!binding) return;
    state.hotkeys[action] = binding;
    render();
    applyHotkeys();
  };
  const handler = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (e.key === "Escape") return done(null);
    if (["Control", "Alt", "Shift", "Meta"].includes(e.key)) return; // wait for the non-modifier
    let b = "";
    if (e.ctrlKey) b += "<Control>";
    if (e.altKey) b += "<Alt>";
    if (e.shiftKey) b += "<Shift>";
    if (e.metaKey) b += "<Super>";
    const name = e.key === " " ? "space" : e.key.length === 1 ? e.key.toLowerCase() : e.key;
    done(b + name);
  };
  window.addEventListener("keydown", handler, true);
}

async function applyHotkeys() {
  if (!live) return toast("Hotkey set (demo)");
  try {
    await api("hotkeys", { method: "POST", body: JSON.stringify(state.hotkeys) });
    toast("Hotkeys updated");
  } catch (e) { toast("Hotkey update failed: " + e.message, 4200); }
}

async function micTest() {
  const btn = $("micTestBtn");
  btn.disabled = true;
  let left = 3;
  $("micResult").textContent = "";
  const tick = setInterval(() => {
    btn.textContent = `🎙 listening… ${left--}s`;
    if (left < 0) { btn.textContent = "🎙 transcribing…"; clearInterval(tick); }
  }, 1000);
  btn.textContent = "🎙 listening… 3s";
  try {
    const out = live
      ? await api("mic-test", { method: "POST" })
      : await new Promise((res) => setTimeout(() => res({ text: "And so, my fellow Americans… (demo)" }), 4200));
    $("micResult").textContent = "heard: " + (out.text || "(nothing)");
  } catch (e) {
    $("micResult").textContent = "test failed: " + e.message;
  }
  clearInterval(tick);
  btn.textContent = "🎙 Test mic";
  btn.disabled = false;
}

// ---------- boot / poll ----------
async function refresh() {
  try {
    const s = await api("state");
    live = true;
    if (!dirty) { state = s; render(); }
    else { state.history = s.history; renderFeed(); }
    setStatus(s.status);
  } catch {
    if (!state) { live = false; state = DEMO; render(); setStatus(DEMO.status); }
  }
}
refresh();
setInterval(refresh, 2000);
</script>
