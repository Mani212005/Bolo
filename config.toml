[stt]
# groq           = cloud, ~0.5s per utterance (fastest)
# faster-whisper = local & private, CTranslate2 INT8 sidecar (fast local pick)
# whisper        = local & private, whisper.cpp (no Python, but slower)
provider = "faster-whisper"

[stt.whisper]
# Local model, shared by both local providers. Warm-transcription time for
# 11s of audio, measured on this machine (CPU, 12 threads):
#   faster-whisper: base.en 0.7s · distil-small.en 1.5s · small.en 1.9s
#   whisper.cpp:    base.en 2.4s · distil-small.en 5.8s · small.en 6.9s
#   large-v3-turbo (any form): 26s+ — do not use on CPU.
# Vocabulary biasing: ~/.config/bolo/vocabulary.txt (one term per line).
model = "small.en"

[groq]
model = "whisper-large-v3-turbo"   # or "distil-whisper-large-v3-en" (English-only, faster)
language = "en"                     # ISO-639-1; improves accuracy AND latency
temperature = 0.0

[vad]
speech_threshold = 0.5              # Silero prob above this = speech
auto_endpoint = false               # true = trailing silence auto-stops the recording
endpoint_silence_ms = 3000          # trailing silence before auto-stop (when auto_endpoint)
min_speech_ms = 300                 # must hear this much speech before endpointing arms
preroll_ms = 300                    # keep audio before speech onset (anti first-word-clip)
max_utterance_ms = 1800000          # hard safety cap (30 min)

[daemon]
notifications = true                # desktop notifications on state changes
sounds = true                       # chime on recording start/stop

[inject]
# paste     = clipboard + synthesized Ctrl+V: whole text lands at once (default)
#             (terminals usually want Ctrl+Shift+V — use Ctrl+V there manually)
# portal    = type char-by-char through the portal (slow but works sans clipboard)
# clipboard = copy only; you paste with Ctrl+V yourself
method = "paste"
type_delay_ms = 2                   # pacing between keystrokes (portal mode)

[inject.terminal]
# macOS: terminals collapse a big paste into "[Pasted text #1 +4 lines]", so Bolo
# pastes a dictation there as several small pastes that every agent shows in full.
# split_paste = true                # false = one paste everywhere, as before
# max_paste_chars = 800             # per piece, UTF-16 units (Claude Code collapses above 800, agy above 1000)
# max_paste_newlines = 2            # line breaks per piece (Claude Code collapses above 2; keep >= 2)
# settle_ms = 50                    # pause between pieces; raise to 100 if a piece is ever lost or doubled
# max_pieces = 40                   # above this, paste once as before
# extra_apps = ["com.microsoft.VSCode"]  # also split in these apps (name or bundle id substrings)
# exclude_apps = []                 # never split in these apps; wins over everything

[enhance]
# NOTE: Enhance sends the transcript to Groq's LLM even when stt.provider is
# "whisper" (local). Clicking Enhance is the opt-in.
model = "llama-3.3-70b-versatile"

[ui]
# Settings app (bolo settings), served by the daemon on 127.0.0.1 only.
port = 4525

[vision]
# Hover-only pointer-guided visual screen context capture
enabled = true                      # hover pointer in a circle to capture screen context
min_angle_degrees = 315.0           # minimum circle arc angle threshold

[formatting]
smart_code = true                   # detect pasted code; fence it in chat apps, paste raw in editors
paragraphs = true                   # split long dictations into paragraphs
list_cues = true                    # "bullet points" / "to-do list" / "first, second, third" make lists
# raw_code_apps = ["Warp"]          # never fence code in these apps
# fenced_code_apps = ["Xcode"]      # always fence code in these apps

[formatting.jev]
enabled = true                      # ask Jev (one request, only when unsure) about ambiguous pastes and spoken lists
# provider = "typesafe"             # "typesafe" (default) or "openrouter"; inferred from the key when unset
# model = "jev-latest"              # empty = provider default (typesafe: jev-latest, openrouter: typesafe/jev-1.13)
timeout_ms = 2500                   # wait this long for Jev, then paste the local result
# api_key = "..."                   # optional: config, else TYPESAFE_API_KEY / OPENROUTER_API_KEY from env or ~/.env
